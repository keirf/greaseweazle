# prefix: compucorp675.

# Compucorp 675 / Metric 85: 5.25" 96tpi, 16 hard sectors, MFM, 256-byte
# sectors, 300 RPM. Read with gw read --hard-sectors in an 80-track drive.
# A 1.2MB (360 RPM) drive works: flux is rescaled to 300 RPM.
#
# Track options (all optional, used only when writing):
#   first = 12     sector ID in the first hard sector after the index, c0 h0
#   cskew = 11     sector skew per cylinder (i.e. -5)
#   hskew = 14     sector skew of head 1 relative to head 0 (i.e. -2)
#   magic = b4c0cc header bytes 3-5 (decoding accepts any value)

disk ds80
     cyls = 80
     heads = 2
     tracks * compucorp675
     end
end

disk ss80
     cyls = 80
     heads = 1
     tracks * compucorp675
     end
end
